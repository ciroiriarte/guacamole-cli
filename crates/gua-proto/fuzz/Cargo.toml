# cargo-fuzz target for the instruction decoder (issues #10, #45).
# Detached from the main workspace (needs nightly + libfuzzer). Run with:
#   rustup toolchain install nightly && cargo install cargo-fuzz
#   cargo +nightly fuzz run parse
[package]
name = "gua-proto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.gua-proto]
path = ".."

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

# Detach from the parent workspace.
[workspace]
